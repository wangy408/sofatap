name: Mac control center cloud build

on:
  push:
    branches: ['feat/macos-control-center']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-control-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Host regression checks with recording input only
        run: dotnet run --project tests/host/SofaTap.Host.Tests.csproj -c Release
      - name: Mac launch and login policy without OS mutations
        run: |
          swiftc desktop/macos/ReceiverLaunchOptions.swift desktop/macos/tests/ReceiverLaunchOptionsTests.swift -o "$RUNNER_TEMP/launch-tests"
          "$RUNNER_TEMP/launch-tests"
          swiftc -parse-as-library -swift-version 5 desktop/macos/ReceiverLoginItem.swift desktop/macos/tests/ReceiverLoginItemTests.swift -o "$RUNNER_TEMP/login-tests"
          "$RUNNER_TEMP/login-tests"
      - name: Mac state and pipe protocol without UI or backend
        run: |
          swiftc -parse-as-library -swift-version 5 desktop/macos/ReceiverProtocol.swift desktop/macos/tests/ReceiverProtocolTests.swift -o "$RUNNER_TEMP/protocol-tests"
          "$RUNNER_TEMP/protocol-tests"
          swiftc -parse-as-library -swift-version 6 desktop/macos/ReceiverProtocol.swift desktop/macos/ReceiverPipeReader.swift desktop/macos/tests/ReceiverPipeTests.swift -o "$RUNNER_TEMP/pipe-tests"
          "$RUNNER_TEMP/pipe-tests"
      - name: Control profiles and redacted diagnostic export
        run: |
          swiftc -parse-as-library -swift-version 6 desktop/macos/ReceiverControlModels.swift desktop/macos/tests/ReceiverControlModelsTests.swift -o "$RUNNER_TEMP/control-model-tests"
          "$RUNNER_TEMP/control-model-tests"
      - name: Independent privacy and backward-compatibility audit
        run: |
          swiftc -parse-as-library -swift-version 6 desktop/macos/ReceiverControlModels.swift desktop/macos/ReceiverProtocol.swift desktop/macos/tests/ReceiverControlAuditTests.swift -o "$RUNNER_TEMP/control-audit-tests"
          "$RUNNER_TEMP/control-audit-tests"
      - name: Build arm64 receiver with ad-hoc signature
        env:
          SOFATAP_SIGN_IDENTITY: '-'
          SOFATAP_MAC_STAGING: ${{ runner.temp }}/mac-staging
        run: bash scripts/build-macos.sh arm64
      - name: Package and verify development DMG
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/mac-staging/SofaTap-macOS-arm64"
          test -f "$stage/LICENSE"
          test -f "$stage/THIRD-PARTY-NOTICES.md"
          codesign --verify --deep --strict --verbose=2 "$stage/Sofatap Receiver.app"
          printf '%s\n' 'Development build: ad-hoc signed, not Developer ID signed or notarized.' 'macOS 15 or newer, Apple silicon only. Physical input has not been verified in CI.' 'Uses the existing app name and bundle identity. Replacing an installed copy can reuse its existing settings and pairing credentials; preserve the installed copy before replacement.' 'An existing Accessibility grant may not survive re-signing; permissions are managed by macOS and are never changed by this build.' 'This package does not disable or bypass Gatekeeper or request Accessibility access.' > "$stage/DEVELOPMENT-BUILD.txt"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "SofaTap Development" -srcfolder "$stage" -format UDZO artifacts/SofaTap-macOS-arm64-development.dmg
          hdiutil verify artifacts/SofaTap-macOS-arm64-development.dmg
          cp "$stage/BUILD-MANIFEST.json" artifacts/BUILD-MANIFEST.json
          cp "$stage/DEVELOPMENT-BUILD.txt" artifacts/DEVELOPMENT-BUILD.txt
          cd artifacts
          shasum -a 256 SofaTap-macOS-arm64-development.dmg > SofaTap-macOS-arm64-development.dmg.sha256
          shasum -a 256 -c SofaTap-macOS-arm64-development.dmg.sha256
      - name: Upload development artifact, no public release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sofatap-macos-arm64-development
          path: |
            artifacts/SofaTap-macOS-arm64-development.dmg
            artifacts/SofaTap-macOS-arm64-development.dmg.sha256
            artifacts/BUILD-MANIFEST.json
            artifacts/DEVELOPMENT-BUILD.txt
          if-no-files-found: error
          retention-days: 14
